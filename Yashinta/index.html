<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Buku Cerita Bawang Putih</title>

    <link rel="stylesheet" href="./css/style.css">
</head>

<body>

    <div class="book">

        <!-- JUDUL -->
        <div class="header">
            <h1>Buku Cerita Bawang Putih</h1>

            <p id="page-indicator">
                Halaman 1 dari 10
            </p>
        </div>


        <!-- GAMBAR -->
        <div class="image-box">

            <img
                id="story-image"
                src="img/1.jpg"
                alt="Gambar cerita Bawang Putih"
            >

        </div>


        <!-- TEKS CERITA -->
        <div class="story-box">

            <p id="story-text">
                Bawang Putih adalah gadis yang rajin dan baik hati.
            </p>

        </div>


        <!-- TOMBOL -->
        <div class="buttons">

            <button
                id="prev-btn"
                class="btn previous"
                onclick="prevPage()"
            >
                ◀ Sebelumnya
            </button>


            <button
                id="stop-btn"
                class="btn stop"
            >
                ■ Berhenti
            </button>


            <button
                id="next-btn"
                class="btn next"
                onclick="nextPage()"
            >
                Selanjutnya ▶
            </button>

        </div>


        <!-- TITIK HALAMAN -->
        <div id="dots" class="dots">
            ● ○ ○ ○ ○ ○ ○ ○ ○ ○
        </div>

    </div>


    <!-- AUDIO BACKSOUND -->
    <audio
        id="backsound"
        src="audio/backsound.mp3"
        loop
    ></audio>


    <script src="./js/app.js"></script>

</body>

</html>
